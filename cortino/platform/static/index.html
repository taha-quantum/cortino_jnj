<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard preview</title>
<style>
  body { margin: 16px; font-family: system-ui, sans-serif; color: #222; background: #f5f5f5; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .filters { display: flex; gap: 16px; margin-bottom: 12px; }
  .filters label { display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
  .page-name { font-size: 16px; margin: 16px 0 8px; }
  .page { position: relative; background: #fff; border: 1px solid #ddd; }
  .chart { position: absolute; box-sizing: border-box; border: 1px solid #e3e3e3; padding: 4px; overflow: hidden; }
  .chart h3 { font-size: 13px; margin: 0; height: 20px; line-height: 20px; overflow: hidden; white-space: nowrap; }
  .legend { font-size: 11px; height: 16px; overflow: hidden; white-space: nowrap; }
  .legend span { margin-right: 8px; }
  .card { font-size: 32px; font-weight: 600; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  th, td { border-bottom: 1px solid #eee; padding: 2px 6px; text-align: left; }
  .body { overflow: auto; }
  .error { color: #b00020; font-size: 12px; }
  svg text { font-size: 10px; fill: #444; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/render.js"></script>
</body>
</html>
